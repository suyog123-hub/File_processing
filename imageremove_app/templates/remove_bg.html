<!-- templates/remove_bg.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Remove Background</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-4">
                        <h3 class="mb-3">
                            <i class="fas fa-wand-magic-sparkles text-primary"></i> Remove Background
                        </h3>
                        <p class="text-muted">Upload an image to remove its background</p>

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}

                        <form method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <input type="file" name="image" class="form-control" accept="image/*" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-wand-magic-sparkles me-2"></i> Remove Background
                            </button>
                        </form>

                        <small class="text-muted d-block mt-3">
                            Supports JPG, PNG, WebP. Max size: 10MB
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
