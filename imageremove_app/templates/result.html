<!-- templates/result.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body text-center p-4">
                        <h4 class="mb-3">
                            <i class="fas fa-check-circle text-success"></i> Done!
                        </h4>

                        <div class="row g-3">
                            <div class="col-6">
                                <p class="text-muted small">Original</p>
                                <img src="{{ image.original.url }}" class="img-fluid rounded" style="max-height: 250px;">
                            </div>
                            <div class="col-6">
                                <p class="text-muted small">Processed</p>
                                <img src="{{ image.processed.url }}" class="img-fluid rounded" style="max-height: 250px;">
                            </div>
                        </div>

                        <div class="mt-4">
                            <a href="{% url 'download' image.id %}" class="btn btn-primary">
                                <i class="fas fa-download me-2"></i> Download PNG
                            </a>
                            <a href="{% url 'remove_bg' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i> Try Another
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
