<!-- templates/my_images.html -->
{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4">My Images</h2>
    
    <div class="row">
        {% for image in images %}
            <div class="col-md-4 mb-3">
                <div class="card">
                    <img src="{{ image.processed.url|default:image.original.url }}" 
                         class="card-img-top" alt="Image">
                    <div class="card-body">
                        <p class="small text-muted">Uploaded: {{ image.uploaded_at|date:"M d, Y" }}</p>
                        <div class="d-flex gap-2">
                            <a href="{% url 'result' image.id %}" class="btn btn-sm btn-primary">View</a>
                            <a href="{% url 'download' image.id %}" class="btn btn-sm btn-success">Download</a>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12 text-center py-5">
                <p class="text-muted">You haven't uploaded any images yet.</p>
                <a href="{% url 'remove_bg' %}" class="btn btn-primary">Upload Now</a>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
